# Colours use MiniMessage tags - see https://docs.advntr.dev/minimessage/format.html
# Do NOT remove the placeholders (<command>, <material>, <option>, <value>) - though their position may change
CONFIG_SET: '<green><option> was set to: <value>'
FORCED_SURVIVAL: '<red>Notice: <gold>You were switched to Survival mode because you do not have permission for Creative mode here.'
HELP: '<gold>Simply switch game modes, and your inventory, armor and xp will change with you.'
INVALID_MATERIAL: '<red>Error: <gold>Invalid material in blacklist'
INVALID_MATERIAL_TRACK: '<red>Error: <gold>Invalid material in dont_track list'
NO_CREATIVE_BREAK: '<red>Error: <gold>You cannot break blocks that were placed in Creative mode!'
NO_CREATIVE_COMMAND: '<red>Error: <gold>You are not allowed to use <green><command></green> in Creative mode!'
NO_CREATIVE_DROPS: '<red>Error: <gold>Blocks that were placed in Creative mode do not give drops!'
NO_CREATIVE_HORSE: '<red>Error: <gold>You are not allowed to access horse inventories in Creative mode!'
NO_CREATIVE_INVENTORY: '<red>Error: <gold>You are not allowed to access inventories in Creative mode!'
NO_CREATIVE_PICKUP: '<red>Error: <gold>You are not allowed to pick up items in Creative mode!'
NO_CREATIVE_PLACE: '<red>Error: <gold><material> placement is disabled in Creative mode!'
NO_CREATIVE_REGION: '<red>Error: <gold>You do not have permission to enter Creative mode in this region!'
NO_PERMISSION: '<red>Error: <gold>You do not have permission to run that command!'
NO_PLAYER_DROPS: '<red>Error: <gold>You are not allowed to drop items in Creative mode!'
NO_WORKBENCH_DROPS: '<red>Error: <gold>Workbenches do not drop items in Creative mode!'
NO_SPECTATOR: '<red>Error: <gold>You are not allowed to be a Spectator!'
NO_ADVENTURE: '<red>Error: <gold>Adventure mode is not allowed in this world!'
NO_TRADE: '<red>Error: <gold>You are not allowed to trade with villagers in Creative mode!'
